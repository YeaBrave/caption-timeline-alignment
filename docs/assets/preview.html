<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>字幕对齐算法研究 — 演示动画</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #f3eee4; color: #1a1612; font: 16px/1.55 "Noto Serif CJK SC", "Newsreader", "Times New Roman", serif; }
    @media (prefers-color-scheme: dark) {
      body { background: #161412; color: #ece6da; }
      p, figcaption { color: #b7b0a4 !important; }
    }
    main { max-width: 1000px; margin: 0 auto; padding: 40px 20px 72px; }
    h1 { font-size: 28px; font-weight: 650; margin: 0 0 8px; letter-spacing: 0.02em; }
    .lang { margin: 0 0 20px; font-size: 14px; }
    .lang a { color: inherit; }
    p { color: #4a453c; margin: 0 0 8px; }
    figure { margin: 32px 0; }
    object, img { width: 100%; height: auto; border-radius: 16px; box-shadow: 0 8px 24px rgba(26,22,18,0.08); background: #faf7f1; }
    figcaption { margin-top: 10px; color: #6b6458; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>字幕对齐算法研究</h1>
    <p class="lang"><a href="../../README.md">中文自述</a> · <a href="../../README.en.md">English</a></p>
    <p>这三张是仓库里的演示动画，用浏览器打开本页即可循环播放。它们说明的是本仓库自己的文稿优先对齐思路。</p>
    <figure>
      <object data="manuscript-first.svg" type="image/svg+xml">manuscript-first</object>
      <figcaption>文稿优先：错误的识别词会被跳过，字幕仍用文稿原文。</figcaption>
    </figure>
    <figure>
      <object data="time-fill.svg" type="image/svg+xml">time-fill</object>
      <figcaption>时间回填：命中片段使用识别时间，中间未命中的文稿按字插值。</figcaption>
    </figure>
    <figure>
      <object data="cue-split.svg" type="image/svg+xml">cue-split</object>
      <figcaption>切条：优先在两个锚点之间的停顿处切开。</figcaption>
    </figure>
  </main>
</body>
</html>
